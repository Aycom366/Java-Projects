spring:
  application:
    name: feedback-app
  datasource:
    url: ${DATABASE_URL}
  jpa:
    # validate: Hibernate checks the schema matches entities but never touches it — Flyway owns all changes now
    hibernate:
      ddl-auto: validate
    show-sql: true
  web:
    error:
      include-message: always
      include-binding-errors: always
